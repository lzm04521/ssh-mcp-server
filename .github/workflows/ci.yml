name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# 发版流程（npm 分发形态）：
#   1. 升级版本号：npm run version:bump -- 1.12.0（以 package.json 为唯一事实源）
#   2. 填写 CHANGELOG.md 当前版本条目，提交推送 main
#   3. 本地发布 npm 包：npm publish --access public（@lzm04521/ssh-mcp-server）

jobs:
  lint-build-test:
    name: Lint & Build & Test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install admin-web dependencies
        run: npm --prefix admin-web ci

      - name: TypeScript check
        run: npx tsc --noEmit

      - name: Build backend & frontend
        run: |
          npm run build
          npm --prefix admin-web run build

      - name: Run tests
        shell: pwsh
        run: |
          node scripts/build.js 2>&1 | Tee-Object -FilePath test-output.log
          node --test test/**/*.test.js 2>&1 | Tee-Object -FilePath test-output.log -Append
          if ($LASTEXITCODE -ne 0) { Write-Host "--- test-output.log ---"; Get-Content test-output.log; exit $LASTEXITCODE }

      - name: Upload test logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-logs
          path: test-output.log
